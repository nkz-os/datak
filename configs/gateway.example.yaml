# DaTaK Gateway Configuration
# Copy this to gateway.yaml and adjust for your environment

gateway:
  name: "DaTaK-Gateway-01"
  log_level: "DEBUG" # DEBUG, INFO, WARNING, ERROR
  data_dir: "/opt/datak/data"

# SQLite for configuration and audit
database:
  url: "sqlite+aiosqlite:///data/gateway.db"
  echo: false # Set true for SQL debug logging

# InfluxDB for time-series data
influxdb:
  url: "http://localhost:8086"
  token: "datak-dev-token"
  org: "datak"
  bucket: "sensors"
  retention_days: 30

# MQTT Broker (local Mosquitto)
mqtt:
  broker: "localhost"
  port: 1883
  client_id: "datak-gateway"
  # username: ""
  # password: ""
  topics:
    - "sensors/#"
    - "esp32/#"

# Digital Twin / Cloud connection (FIWARE IoT Agent JSON over MQTT)
# ─────────────────────────────────────────────────────────────────
# DaTaK acts as a northbound gateway: it collects local sensor data and
# publishes it to a remote FIWARE IoT Agent JSON via MQTT.
#
# Setup:
#   1. Create a device in Nekazari via EntityWizard (or SDM API)
#   2. Copy the MQTT credentials shown after creation
#   3. Fill in the values below (or override via DATAK_DIGITAL_TWIN_* env vars)
#
# Protocol: FIWARE IoT Agent JSON MQTT binding
#   - Topic:   /<apikey>/<device_id>/attrs
#   - Payload: { "attributeName": value }
#   - The IoT Agent translates this into NGSI-LD entities in Orion-LD
#
# For TLS: use port 8883 or 443 (auto-detected by cloud_sync)
# For plain MQTT: use port 1883 (or NodePort e.g. 31883)
digital_twin:
  enabled: false
  host: ""                # Nekazari server IP or hostname
  port: 1883              # MQTT port (1883/31883 plain, 8883/443 TLS)
  topic: ""               # /<apikey>/<device_id>/attrs (from wizard)
  username: ""            # MQTT broker username
  password: ""            # MQTT broker password (use env var DATAK_DIGITAL_TWIN_PASSWORD)
  entity_type: "Device"
  # Filled by scripts/setup_nekazari.py from the platform datalogger config:
  # one entry per platform Device {externalId, name, topic, measurements}.
  # A sensor publishes on the Device named by its twin_entity_id; sensors with
  # an unlisted Device are skipped. Empty list = legacy single `topic` above.
  devices: []
  # Send the device reading time as "TimeInstant" (UTC). The platform keeps it
  # as the observation time, so buffered readings sent late keep their time.
  send_timestamp: true
  # Seconds per northbound window. 0 = send every reading as it arrives. N > 0 =
  # one message per Device every N s (windows aligned to the clock), each value
  # the window mean, TimeInstant = window end. Raw readings stay local.
  publish_interval_s: 60
  # Attributes sent as the window's last value instead of the mean (counters).
  last_value_attributes:
    - precipitationAccumulated

# CSV Report Generation
reports:
  enabled: true
  output_dir: "data/exports"
  intervals:
    - "1min"
    - "5min"
    - "1hour"
  retention:
    compress_after_days: 7
    delete_after_days: 365

# Security
security:
  # Set to true in production: the gateway refuses to boot with insecure
  # default secrets (jwt_secret / influxdb_token). Secret values themselves
  # must come from DATAK_* env vars, not this file.
  production: false
  jwt_secret: "CHANGE-THIS-IN-PRODUCTION-use-openssl-rand-base64-32"
  jwt_algorithm: "HS256"
  token_expire_minutes: 1440 # 24 hours

# API Server
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1 # Keep 1 for hardware access consistency
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://YOUR_VPN_IP:5173"

# Metrics (Prometheus)
metrics:
  enabled: true
  port: 9100

# Modbus bus scheduling (applies to every Modbus TCP gateway / RS485 port)
# One scheduler per bus serialises all traffic. A missing or dead slave can
# never block the others: each transaction has its own deadline, each polling
# round is capped, and unresponsive slaves are quarantined with backoff.
modbus:
  round_budget_ms: 1000        # max worst-case bus time per polling round
  transaction_timeout_ms: 250  # default per-transaction deadline
                               # (per sensor: connection_params.transaction_timeout_ms)
  quarantine_max_s: 60         # max backoff between probes of a dead slave
  gateway_settle_ms: 0         # pause after a failed transaction (see note)
# NOTE: a Modbus-TCP->RTU gateway (e.g. EBYTE) has its own serial response
# timeout. Preferably set it SHORTER than transaction_timeout_ms. If it cannot
# be changed, set gateway_settle_ms >= gateway timeout - transaction_timeout_ms,
# otherwise the sensor polled right after a dead slave also times out.
