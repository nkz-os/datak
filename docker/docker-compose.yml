version: "3.8"

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: datak-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      # Required: compose refuses to start rather than fall back to a value
      # baked into the file, which would be the same for every install.
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?set it in docker/.env}
      - DOCKER_INFLUXDB_INIT_ORG=datak
      - DOCKER_INFLUXDB_INIT_BUCKET=sensors
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:?set it in docker/.env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: datak-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: datak-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: datak-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set it in docker/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - influxdb
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: datak-backend
    ports:
      - "8000:8000"
    environment:
      - DATAK_INFLUXDB_URL=http://influxdb:8086
      - DATAK_MQTT_BROKER=mosquitto
      - DATAK_DATABASE_URL=sqlite+aiosqlite:////app/data/gateway.db
    volumes:
      - backend_data:/app/data
      - ../configs/gateway.yaml:/app/configs/gateway.yaml
      - /dev:/dev
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
    privileged: true
    depends_on:
      - influxdb
      - mosquitto
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://100.95.129.22:8000
    container_name: datak-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:
  backend_data:

networks:
  default:
    name: datak-network
